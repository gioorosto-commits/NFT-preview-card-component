<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT preview card component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="nft-card">
        
        <!-- NFT სურათი -->
        <div class="nft-image-container">
            <img src="./image-equilibrium.jpg" alt="Equilibrium NFT" class="nft-image">
        </div>

        <!-- სათაური -->
        <h1>Equilibrium #3429</h1>

        <!-- აღწერა -->
        <p class="nft-description">Our Equilibrium collection promotes balance and calm.</p>

        <!-- ფასი და დარჩენილი დრო -->
        <div class="nft-info">
            <div class="nft-price">
                <!-- აქ შეგიძლია ჩასვა ეთერიუმის პატარა აიქონი (svg/png) -->
                <span>0.041 ETH</span>
            </div>
            <div class="nft-time">
                <!-- აქ შეგიძლია საათის პატარა აიქონი ჩასვა -->
                <span>3 days left</span>
            </div>
        </div>

        <!-- ავტორის ინფორმაცია -->
        <div class="nft-author">
            <img src="./image-avatar.png" alt="Creation of Jules Wyvern" class="author-avatar">
            <p>Creation of <span class="author-name">Jules Wyvern</span></p>
        </div>

    </div>

</body>
</html>
